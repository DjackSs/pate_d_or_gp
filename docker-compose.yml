version: '2'
services:
 db:
  build: ./BDD/mysql/
  restart: always
  environment:
   MYSQL_ROOT_PASSWORD: hello
   MYSQL_USER: nat
   MYSQL_PASSWORD: sqlJeTaime
   MYSQL_DATABASE: pate_d_or
